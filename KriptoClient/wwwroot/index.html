<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>KriptoClient</title>
    <base href="/" />
    <link href="css/bootstrap/bootstrap.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="KriptoClient.styles.css" rel="stylesheet" />
    <!-- Must come before blazor.webassembly.js: Firefox ignores an import map that appears
         after the first module has started loading. -->
    <script type="importmap">
        {
            "imports": {
                "@noble/curves/": "/lib/noble/curves/",
                "@noble/hashes/": "/lib/noble/hashes/",
                "@noble/ciphers/": "/lib/noble/ciphers/"
            }
        }
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // Helpers for Pages/WasmBenchmark.razor.
        window.kriptoBench = {
            environment: function () {
                // Smallest step performance.now() can show.
                let resolution = Infinity;
                for (let i = 0; i < 50; i++) {
                    const t0 = performance.now();
                    let t1 = performance.now();
                    while (t1 === t0) t1 = performance.now();
                    resolution = Math.min(resolution, t1 - t0);
                }
                return {
                    userAgent: navigator.userAgent,
                    crossOriginIsolated: !!window.crossOriginIsolated,
                    timerResolutionMs: resolution
                };
            },
            download: function (fileName, content) {
                const url = URL.createObjectURL(new Blob([content], { type: "application/json" }));
                const a = document.createElement("a");
                a.href = url;
                a.download = fileName;
                a.click();
                URL.revokeObjectURL(url);
            }
        };
    </script>
    <script type="module">
        // JavaScript baselines (WebCrypto and noble) for Pages/WasmBenchmark.razor.
        import { run } from '/js/js-bench.js';
        window.kriptoJsBench = { run: async engine => JSON.stringify(await run(engine)) };
    </script>
</body>

</html>
